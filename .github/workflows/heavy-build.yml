name: heavy-build

# One-time (or rare) full OrangeFox build producing the recovery fragment blob
# consumed by the cheap patch pipeline. Manual dispatch ONLY: a full AOSP
# manifest sync does not fit a routine CI budget. Never auto-runs on push.

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Space-separated variants to build"
        required: false
        default: "X6885 X6886"
      release_tag:
        description: "Publish blobs to this release tag (empty = artifacts only)"
        required: false
        default: ""

concurrency:
  group: heavy-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      SYNC_DIR: ${{ github.workspace }}/fox_sync
      USE_CCACHE: "1"
      CCACHE_EXEC: /usr/bin/ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6

      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: heavy-ccache-${{ hashFiles('config/fox.json', 'patches/fox/**') }}
          restore-keys: heavy-ccache-

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.2.0"
          testing: false

      - name: Setup Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32readline-dev lib32z1-dev lz4 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2-utils lzop pngcrush \
            repo rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          git config --global user.email "ci@${{ github.repository_owner }}.local"
          git config --global user.name "ci"
          git config --global --add safe.directory '*'

      - name: Sync Fox manifest (pinned by config/fox.json)
        run: |
          read -r MANIFEST_URL MANIFEST_BRANCH < <(python3 -c "
          import json
          m = json.load(open('config/fox.json'))['manifest']
          print(m['url'], m['branch'])")
          mkdir -p "$SYNC_DIR" && cd "$SYNC_DIR"
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" \
            --no-clone-bundle --no-tags
          repo sync -c -j"$(nproc --all)" --no-clone-bundle --no-tags --force-sync
          git -C .repo/manifests rev-parse HEAD > "$GITHUB_WORKSPACE/manifest.sha"
          # Reclaim ~35GB: source is checked out, .repo is not needed for build.
          rm -rf .repo
          df -h /

      - name: Overlay device tree and Fox patches
        run: |
          mkdir -p "$SYNC_DIR/device"
          cp -r "$GITHUB_WORKSPACE/device/infinix" "$SYNC_DIR/device/"
          shopt -s nullglob
          for p in "$GITHUB_WORKSPACE"/patches/fox/*.patch; do
            patch -p1 -d "$SYNC_DIR" < "$p"
          done

      - name: Build vendorbootimage per variant
        run: |
          ccache -z
          cd "$SYNC_DIR"
          export ALLOW_MISSING_DEPENDENCIES=true
          # Source Fox envsetup with errexit off: foreign vendorsetup.sh trips `bash -e`.
          ls -l build/envsetup.sh
          set +e
          source build/envsetup.sh
          ENVSETUP_RC=$?
          set -e
          echo "envsetup exit: $ENVSETUP_RC"
          [ "$ENVSETUP_RC" -eq 0 ]
          for V in ${{ inputs.variants }}; do
            export FOX_BUILD_DEVICE="$V"
            lunch "ofox_${V}-bp2a-eng" || {
              echo "lunch ofox_${V}-bp2a-eng failed; products visible:"
              grep -rh "PRODUCT_NAME" device/infinix/*/ofox_*.mk || true
              exit 1
            }
            m vendorbootimage
            ls "out/target/product/${V}/"
            IMG=$(ls "out/target/product/${V}"/OrangeFox-*.img 2>/dev/null | head -n 1)
            [ -z "$IMG" ] && IMG="out/target/product/${V}/vendor_boot.img"
            cp "$IMG" "$GITHUB_WORKSPACE/vendor_boot-${V}-fox.img"
          done

      - name: Extract recovery fragments + BuildInfo
        run: |
          for V in ${{ inputs.variants }}; do
            python3 scripts/patch-vendor-boot.py --extract \
              "vendor_boot-${V}-fox.img" "recovery-${V}.bin"
          done
          {
            echo "repo=${{ github.repository }}@${{ github.sha }}"
            echo "manifest_sha=$(cat manifest.sha)"
            echo "fox_json_sha=$(sha256sum config/fox.json | cut -d' ' -f1)"
            echo "variants=${{ inputs.variants }}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "--- ccache stats ---"
            ccache -s
          } > BuildInfo.txt
          cat BuildInfo.txt
          sha256sum vendor_boot-*-fox.img recovery-*.bin BuildInfo.txt | tee SHA256SUMS.txt

      - name: Save compiler cache (even on failure)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: heavy-ccache-${{ hashFiles('config/fox.json', 'patches/fox/**') }}-${{ github.run_id }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: heavy-build
          path: |
            vendor_boot-*-fox.img
            recovery-*.bin
            BuildInfo.txt
            SHA256SUMS.txt

      - name: Publish release
        if: inputs.release_tag != ''
        run: |
          gh release create "${{ inputs.release_tag }}" --prerelease \
            --title "${{ inputs.release_tag }}" \
            --notes "OrangeFox recovery blobs for X6885/X6886. Feed recovery-<V>.bin into the patch pipeline via fragment_release/fragment_asset." \
            vendor_boot-*-fox.img recovery-*.bin BuildInfo.txt SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
